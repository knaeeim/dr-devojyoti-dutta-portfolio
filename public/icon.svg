<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Deep Ayurvedic Emerald Background with Rounded Corners -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#gold)" stroke-width="2.5" />

  <!-- Botanical Ayurvedic Leaf Accent on Top-Right -->
  <path d="M46 7 C54 8 57 15 52 20 C46 19 43 13 46 7 Z" fill="url(#leafGrad)" />

  <!-- Bold, Centered "DD" Monogram for Dr. Devojyoti Dutta -->
  <text x="32" y="44" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', Arial, sans-serif" 
        font-size="31" 
        font-weight="900" 
        letter-spacing="-0.5" 
        fill="#ffffff" 
        text-anchor="middle">DD</text>
</svg>